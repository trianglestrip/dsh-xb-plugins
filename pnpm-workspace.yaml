packages:
  # Plugin bundles: one independent, separately installable plugin per directory.
  - packages/*
  # The deployment layer: a patch-only bundle that composes the product and is
  # deliberately NOT a plugin. See deploy/README.md.
  - deploy

# Single source of truth for the toolchain shared by every package.
catalog:
  '@types/node': ^22.18.0
  tsdown: ^0.22.2
  typescript: ^6.0.3
  vitest: ^4.1.8

# pnpm 10+ blocks dependency build scripts by default. Only allow the ones this
# repo genuinely needs; everything else is denied.
allowBuilds:
  esbuild: true
