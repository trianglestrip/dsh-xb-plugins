# The layer this bundle contributes when a profile lists `dsh-xb-xiaobo-persona`.
#
# Mounting the row adds the Xiaobo prompt sections to every session in the
# profile. Everything below is optional: the plugin's schema defaults ship the
# English fragments with all six sections enabled, so no config is required.
- insert:
    - id: xiaobo-persona
      name: dsh-xb-xiaobo-persona
      # config:
      #   # Text is English by default. Set `zh` to switch every fragment, or
      #   # override individual sections with the `identity`, `domainPolicy`, … keys.
      #   locale: zh
      #   # Section toggles, all default true. Drop a section by setting false.
      #   includeIdentity: true
      #   includeDomainPolicy: true
      #   includeSafetyRedlines: true
      #   includeInteractionNorms: true
      #   includeObjectivity: true
      #   includeProductHelp: true
      #   # Registry default is true; set false when an override carries literal {{...}}.
      #   interpolate: false
      #   # Per-section text overrides, used only when non-empty.
      #   identity: ''
      #   domainPolicy: ''
      #   safetyRedlines: ''
      #   interactionNorms: ''
      #   objectivity: ''
      #   productHelp: ''
